extends:
  - theme-check:recommended

# The date-picker block below is provided by an installed app (cx-elevate-date-time-picker) and
# only exists on the store, not in this repo, so Theme Check can never resolve it locally.
JSONMissingBlock:
  enabled: true
  severity: error
  ignore:
    - 'templates/product.product-with-date.json'
    - 'templates/product.producto-personalizado.json'

# Three groups of false positives / unfixable files:
# - The two bridge snippets render via "custom_liquid" settings in JSON (sections/footer-group.json,
#   templates/page.contacto.json), which Theme Check cannot see.
# - mionas-box, mionas-checkbox and mionas-form-actions are design-system primitives kept as a
#   library for future components (mionas-design-component skill).
# - The native header-drawer, mega-menu-list and util-mega-menu-img-sizes-attr are superseded by
#   mionas forks but must stay untouched so upstream merges keep working.
OrphanedSnippet:
  ignore:
    - 'snippets/mionas-footer-bridge.liquid'
    - 'snippets/contacto-page-bridge.liquid'
    - 'snippets/mionas-box.liquid'
    - 'snippets/mionas-checkbox.liquid'
    - 'snippets/mionas-form-actions.liquid'
    - 'snippets/header-drawer.liquid'
    - 'snippets/mega-menu-list.liquid'
    - 'snippets/util-mega-menu-img-sizes-attr.liquid'

# Native files we never edit; their cross-file class warnings are upstream's to fix.
ValidScopedCSSClass:
  ignore:
    - 'snippets/header-drawer.liquid'
    - 'snippets/mega-menu-list.liquid'
