extends:
  - theme-check:recommended

# The date-picker block below is provided by an installed app (cx-elevate-date-time-picker) and
# only exists on the store, not in this repo, so Theme Check can never resolve it locally.
JSONMissingBlock:
  enabled: true
  severity: error
  ignore:
    - 'templates/product.product-with-date.json'
    - 'templates/product.producto-personalizado.json'

# Three groups of false positives / unfixable files:
# - The bridge snippets render via "custom_liquid" settings in JSON (sections/footer-group.json,
#   templates/page.contacto.json, templates/page.faq.json), which Theme Check cannot see.
# - mionas-box, mionas-checkbox and mionas-form-actions are design-system primitives kept as a
#   library for future components (mionas-design-component skill).
# - The native header-drawer, mega-menu-list and util-mega-menu-img-sizes-attr are superseded by
#   mionas forks but must stay untouched so upstream merges keep working.
OrphanedSnippet:
  ignore:
    - 'snippets/mionas-footer-bridge.liquid'
    - 'snippets/contacto-page-bridge.liquid'
    - 'snippets/mionas-faq-cta-bridge.liquid'
    - 'snippets/mionas-box.liquid'
    - 'snippets/mionas-checkbox.liquid'
    - 'snippets/mionas-form-actions.liquid'
    - 'snippets/header-drawer.liquid'
    - 'snippets/mega-menu-list.liquid'
    - 'snippets/util-mega-menu-img-sizes-attr.liquid'

# Native files we never edit; their cross-file class warnings are upstream's to fix.
ValidScopedCSSClass:
  ignore:
    - 'snippets/header-drawer.liquid'
    - 'snippets/mega-menu-list.liquid'

# These locales aren't published on this store, so their translations are allowed to lag behind
# en.default.json. If one is published later, remove it from this list and backfill whatever
# keys it's missing, or that storefront will show "Translation missing". The ignore is
# file-scoped, not key-scoped, so every key added to en.default.json from now on goes unchecked
# against these files too.
MatchingTranslations:
  ignore:
    - 'locales/ar.json'
    - 'locales/bg.json'
    - 'locales/cs.json'
    - 'locales/da.json'
    - 'locales/de.json'
    - 'locales/el.json'
    - 'locales/fi.json'
    - 'locales/fr.json'
    - 'locales/he.json'
    - 'locales/hr.json'
    - 'locales/hu.json'
    - 'locales/id.json'
    - 'locales/it.json'
    - 'locales/ja.json'
    - 'locales/ko.json'
    - 'locales/lt.json'
    - 'locales/nb.json'
    - 'locales/nl.json'
    - 'locales/pl.json'
    - 'locales/pt-BR.json'
    - 'locales/pt-PT.json'
    - 'locales/ro.json'
    - 'locales/ru.json'
    - 'locales/sk.json'
    - 'locales/sl.json'
    - 'locales/sv.json'
    - 'locales/th.json'
    - 'locales/tr.json'
    - 'locales/ur.json'
    - 'locales/vi.json'
    - 'locales/zh-CN.json'
    - 'locales/zh-TW.json'
