# Theme IDs (not names) are pinned here: on mionasbakery, several themes have
# similar names ("horizon/main", "shopify-dawn-theme/production"), so a name
# match risked resolving ambiguously or hitting the wrong theme. IDs make
# `theme pull`/`theme push` fully non-interactive.

# Used when no --environment is given, so `shopify theme dev` always opens a development theme on the
# production store. It pins no theme on purpose: the live theme would make `theme dev` edit it live.
[environments.default]
store = "mionasbakery"

[environments.production]
store = "mionasbakery"
theme = "203594301771" # horizon/main (live on production; a push needs --allow-live)

[environments.staging]
store = "mionasbakery"
theme = "209356521803" # horizon/staging (unpublished; release candidates land here)
